name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a puzzle round
        2. Drag a line from ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Puzzle
        - Room
        - Shop
        - UI
        - Save
        - Build
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Unity Device Simulator (iPhone 13) / Android phone model, build version"
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
